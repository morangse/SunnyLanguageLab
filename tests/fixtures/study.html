<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sunny 0.6 · 独立重写交互测试</title><style>body{margin:0;background:#e8ede5;font:16px Georgia,serif;color:#203238}.stage{width:min(100%,980px);aspect-ratio:16/9;background:#203238;display:grid;place-items:center;position:relative}.stage video{position:absolute;inset:0;width:100%;height:100%}.stage p{color:#e6c778;font-size:clamp(18px,4vw,42px);padding:25px}.intro{padding:20px;max-width:600px}h1{font-weight:400;font-size:28px}</style></head><body><div class="stage"><video id="video" playsinline></video><p>Make time for one more sentence.</p></div><div class="intro"><h1>一句，一次，慢慢来。</h1><p>这是固定字幕与假服务响应的测试页面，不能代替 YouTube 和 Safari 真机验证。</p></div><script type="module">
import { StudySurface } from '../../extension/src/content/surface.js';
import { DEFAULTS } from '../../extension/src/background/settings.js';
import { lookupChinese } from '../../extension/src/background/chinese-dictionary.js';
window.errors = []; addEventListener('error', event => errors.push(event.message)); addEventListener('unhandledrejection', event => errors.push(String(event.reason)));
window.video = document.getElementById('video'); window.media = { time: 0.4, paused: true }; window.calls = []; window.items = [];
Object.defineProperty(video,'currentTime',{ get(){return media.time},set(value){media.time=value;video.dispatchEvent(new Event('seeking'))} });
Object.defineProperty(video,'paused',{get(){return media.paused}}); video.play=async()=>{media.paused=false;video.dispatchEvent(new Event('play'))};video.pause=()=>{media.paused=true;video.dispatchEvent(new Event('pause'))};
let settings = {...DEFAULTS,blurNative:true};
const readBucket = async letter => (await fetch('../../extension/src/ipad/data/en-zh-'+letter+'.json')).json();
async function send(type,payload={}){calls.push({type,...payload});if(type==='preferencesPatch'){settings={...settings,...payload.patch};return {settings}}if(type==='vocabList')return {items};if(type==='lookup'){const result=await lookupChinese(payload.text,readBucket);return {...(result||{kind:'missing',meaning:'本机词库未收录'}),saved:items.some(item=>item.text===payload.text)}}if(type==='vocabToggle'){const found=items.findIndex(item=>item.text===payload.item.text);if(found>=0)items.splice(found,1);else items.push({...payload.item,id:'en|'+payload.item.text.toLowerCase()});return {saved:found<0,items}}if(type==='vocabRemove'){items=items.filter(item=>item.id!==payload.id);return {items}}if(type==='englishLookup')return {entries:[{part:'noun',text:'<img src=x onerror=alert(1)> an attempt'}],url:'https://en.wiktionary.org/wiki/practice'};if(type==='aiExplain')return {text:'练习：反复尝试以获得进步。',model:'fixture-only'};if(type==='openOptions')return {ok:true};throw new Error(type)}
window.cues=[{start:0,end:4,text:'Practice makes learning remarkable.',native:'练习让学习变得精彩。'},{start:5,end:9,text:'Make time for one more sentence.',native:'再给一句话留点时间。'},{start:10,end:14,text:'Small steps build resilient habits.',native:'小步前进，养成有韧性的习惯。'}];
window.study=new StudySurface({video,send,settings});study.setCues(cues,{id:'fixture',title:'Sunny test'});study.setExpanded(true);study.onReload=async()=>study.setCues(cues,{id:'fixture',title:'Sunny test'});window.fixtureReady=true;
</script></body></html>
